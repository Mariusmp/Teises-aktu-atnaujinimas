name: Auto-Merge Jules PRs

on:
  pull_request:
    types: [opened, synchronized]

jobs:
  test-and-merge:
    # Užduotis vykdoma TIK jei PR autorius yra Jules botas
    if: github.event.pull_request.user.login == 'google-jules[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Atsisiųsti kodą
        uses: actions/checkout@v4

      # Pavyzdys su Python (pakeiskite pagal savo kalbą: Node.js, Go ir t.t.)
      - name: Konfigūruoti aplinką
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.11'

      - name: Įdiegti priklausomybes ir paleisti testus
        run: |
          pip install -r requirements.txt
          pytest  # Čia nurodoma jūsų testų paleidimo komanda

      # Jei testai praeina sėkmingai, šis žingsnis automatiškai sujungia kodą
      - name: Sujungti pakeitimus (Merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto
