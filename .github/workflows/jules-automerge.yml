name: Auto-Merge Jules PRs

on:
  pull_request:
    types: [opened, synchronized]

jobs:
  test-and-merge:
    # Užduotis vykdoma TIK jei PR autorius yra jūsų Jules botas
    if: github.event.pull_request.user.login == 'google-labs-jules[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Atsisiųsti kodą
        uses: actions/checkout@v4

      # Konfigūruojame aplinką testams (pavyzdys su Node.js/JavaScript, jei naudojate kita kalba, pakeiskite)
      - name: Konfigūruoti Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Įdiegti priklausomybes ir paleisti testus
        run: |
          npm ci
          npm test  # Čia paleidžiami Jules sugeneruoti testai

      # Jei testai praėjo, GitHub pats sujungia kodą
      - name: Automatiškai sujungti (Merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto
