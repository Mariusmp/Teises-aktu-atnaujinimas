name: Auto-Merge Jules PRs

on:
  pull_request:
    types: [opened, synchronized]

jobs:
  test-and-merge:
    # Užduotis vykdoma TIK jei PR autorius yra jūsų Jules botas
    if: github.event.pull_request.user.login == 'google-labs-jules[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Atsisiųsti kodą
        uses: actions/checkout@v4

      # Konfigūruojame aplinką testams
      - name: Konfigūruoti Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Įdiegti priklausomybes
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Paleisti testus
        env:
          APP_PASSWORD: dummy_password_for_tests
          SPREADSHEET_ID: dummy_sheet_id
          DRIVE_FOLDER_ID: dummy_folder_id
          RANGE_NAME: "Sheet1!A:B"
        run: |
          ./fix_tests2.sh
          python -m unittest test_app.py
          python -m unittest test_google_auth.py
          python -m unittest test_TA_update_web.py
          python -m unittest test_TA_update_web_logger.py

      # Jei testai praėjo, GitHub pats sujungia kodą
      - name: Automatiškai sujungti (Merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto
